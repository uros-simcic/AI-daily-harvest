name: Daily News Harvest

on:
  schedule:
    # 05:19 UTC, off the hour.
    # Last merge-commit on this cron line sets the schedule actor.
    # A GitHub App squash-merge sets the actor to the app and
    # scheduled runs stop. Merge this file as a merge commit,
    # logged in as the repo owner. Never squash.
    - cron: "19 5 * * *"
  # manual runs from the actions tab, for testing
  workflow_dispatch:
    inputs:
      preview:
        description: "Generate takeaways without sending email or updating history"
        type: boolean
        default: false

# the job only needs to read the repo, nothing more
permissions:
  contents: read

jobs:
  send-harvest:
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check lesson attribution
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python - <<'PY'
          import fetch_and_summarize as harvest

          # Constructed passages. Each pair changes one detail.
          cases = [
              ("Citation review", "Before publication the editor asked ChatGPT to verify each citation.",
               "The editor asked ChatGPT to verify citations.",
               "ChatGPT asked the editor to verify citations."),
              ("Gemini memory use", "Google measured lower memory use by Gemini in its own benchmarks. Independent tests are pending.",
               "Google’s benchmarks showed Gemini used less memory.",
               "Independent benchmarks showed Gemini used less memory."),
              ("Model measurements", "OpenAI observed new capabilities alongside lower perplexity in its own models. It evaluated no other models.",
               "Lower perplexity accompanied new capabilities in OpenAI’s models.",
               "Lower perplexity accompanied new capabilities in all models."),
              ("Firmware rollout", "A hang affects a subset of hosts. The fix must reach every affected host. Other hosts need no update.",
               "The fix must reach every affected host.",
               "The fix must reach every host."),
              ("Measuring AI development", "The author suggests using perplexity to set shared limits. The method has yet to be demonstrated.",
               "The author proposes using perplexity to set shared limits.",
               "The author demonstrates using perplexity to set shared limits."),
          ]
          articles = [{"title": title, "description": source} for title, source, _, _ in cases]
          client = harvest.build_client()
          matches = []
          for batch in (0, 1):
              expected = [(i + batch) % 2 == 0 for i in range(len(cases))]
              lessons = [good if keep else bad for (_, _, good, bad), keep in zip(cases, expected)]
              results = harvest.validate_takeaways(client, articles, lessons)
              for lesson, result, keep in zip(lessons, results, expected, strict=True):
                  kept = result is not None
                  matches.append(kept == keep)
                  print(f"{lesson} | expected keep={keep}, observed keep={kept}")
          print(f"{sum(matches)}/{len(matches)} correct")
          raise SystemExit(0 if all(matches) else 1)
          PY
