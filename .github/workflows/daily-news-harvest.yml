name: Daily News Harvest

on:
  schedule:
    # 05:19 UTC, off the hour.
    # Last merge-commit on this cron line sets the schedule actor.
    # A GitHub App squash-merge sets the actor to the app and
    # scheduled runs stop. Merge this file as a merge commit,
    # logged in as the repo owner. Never squash.
    - cron: "19 5 * * *"
  # manual runs from the actions tab, for testing
  workflow_dispatch:
    inputs:
      preview:
        description: "Generate takeaways without sending email or updating history"
        type: boolean
        default: false

# the job only needs to read the repo, nothing more
permissions:
  contents: read

jobs:
  send-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: restore list of already sent articles
        uses: actions/cache@v6
        with:
          path: seen_titles.txt
          # unique key per run + prefix restore: the newest list is
          # restored at start, the updated one saved after the run
          key: seen-titles-${{ github.run_id }}
          restore-keys: seen-titles-

      - run: pip install -r requirements.txt

      - name: fetch, summarize and send
        env:
          HARVEST_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && '1' || '0' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          
          try:
              response = requests.post(
                  "https://api.mistral.ai/v1/chat/completions",
                  headers={
                      "Authorization": "Bearer " + os.environ["MISTRAL_API_KEY"]
                  },
                  json={
                      "model": "mistral-small-2603",
                      "messages": [{"role": "user", "content": "Reply OK."}],
                      "max_tokens": 32,
                  },
                  timeout=30,
              )
          except requests.RequestException:
              sys.exit("Diagnostic transport failure; no email sent")
          
          print("HTTP status:", response.status_code)
          try:
              data = response.json()
          except ValueError:
              sys.exit("Non-JSON response; no email sent")
          if not isinstance(data, dict):
              sys.exit("Unexpected response; no email sent")
          
          code = data.get("code")
          print("Provider code:", code if isinstance(code, int) else "unavailable")
          succeeded = response.ok and bool(data.get("choices"))
          print("Tiny completion succeeded:", succeeded)
          sys.exit(0 if succeeded else 1)
          PY
