name: Daily News Harvest

on:
  schedule:
    # 07:19 UTC, plus 15:19 UTC if GitHub drops the morning slot.
    # seen_titles.txt makes the backup a no-op after a successful
    # morning send. Last merge-commit on this file sets the
    # schedule actor. A GitHub App squash-merge sets the actor to
    # the app and scheduled runs stop. Merge this file as a merge
    # commit, logged in as the repo owner. Never squash.
    - cron: "19 7 * * *"
    - cron: "19 15 * * *"
  # manual runs from the actions tab, for testing
  workflow_dispatch: {}

# the job only needs to read the repo, nothing more
permissions:
  contents: read

jobs:
  send-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: restore list of already sent articles
        uses: actions/cache@v6
        with:
          path: seen_titles.txt
          # unique key per run + prefix restore: the newest list is
          # restored at start, the updated one saved after the run
          key: seen-titles-${{ github.run_id }}
          restore-keys: seen-titles-

      - run: pip install -r requirements.txt

      - name: fetch, summarize and send
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python fetch_and_summarize.py
